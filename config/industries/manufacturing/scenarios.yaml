scenarios:
  - id: "mfg_cxo_01"
    title: "Plant A Downtime & Remediation Analysis"
    badge: "Multi-Source Disruption"
    question: "What are the major factors contributing to production downtime at Plant A, and what actions have previously reduced similar downtime?"
    description: "Requires querying the downtime database, retrieving SOP maintenance steps, cross-referencing engineering memos, and highlighting a documented root-cause conflict."
    suggested: true
    difficulty: "Complex"

  - id: "mfg_cxo_02"
    title: "Equipment Anomaly: Downtime vs. Quality Drift"
    badge: "Cross-System Anomaly"
    question: "Which production lines show a combination of rising downtime and declining quality, and what evidence explains the pattern?"
    description: "Correlates MES scrap rates with line failure logs and technician shift handoff notes."
    suggested: true
    difficulty: "Complex"

  - id: "mfg_cxo_03"
    title: "Supplier Quality Risk & Corrective Actions"
    badge: "Supply Chain Risk"
    question: "Which suppliers are associated with the highest quality-impact events, and what do supplier documents say about corrective actions?"
    description: "Queries incoming lot defect PPM and retrieves formal corrective action request (CAR) documentation."
    suggested: true
    difficulty: "Medium"

  - id: "mfg_cxo_04"
    title: "Maintenance SOP Procedure Evolution"
    badge: "Process Evolution"
    question: "What changed between the previous and current maintenance procedures, and is there evidence that the change affected downtime?"
    description: "Diffs SOP v3.0 vs v4.2 and links changes to subsequent machine MTBF."
    suggested: false
    difficulty: "Medium"

  - id: "mfg_cxo_05"
    title: "Root Cause Conflict Investigation"
    badge: "Conflict Detection"
    question: "Where do the production report and maintenance documentation disagree, and which source is more recent?"
    description: "Evaluates the direct discrepancy between initial shift logs and final teardown engineering findings."
    suggested: true
    difficulty: "High"
